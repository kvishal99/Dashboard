####################################################################
# Ops Dashboard configuration
#
# The partner list is NOT here - it is discovered from the database on
# every run (see `partner_discovery` below). The `partner_meta` block
# at the bottom only supplies cosmetic extras (server, frequency,
# path, note) read from "Monday Partner Status - Final.csv".
#
# partner_meta was last regenerated from the CSV dated 2026-07-29.
####################################################################

app:
  # Shared secret that agent.py sends in the x-agent-secret header.
  agent_secret: "change-this-to-a-secure-token"
  # ---- MySQL: strictly hourly ---------------------------------------------
  # counts_hourly fires the grouped COUNT() sweep on the top of every hour and
  # at no other time: 24 hits in 24 hours, exactly. A plain interval timer
  # cannot promise that - each cycle starts its wait only after the previous
  # run finishes, so a ~75s sweep pushes every later run further into the hour,
  # and every restart of the process begins a brand new cycle.
  #
  # Restarts don't buy an extra sweep either: on startup the dashboard collects
  # only if the stored counts are already older than an hour.
  counts_hourly: true
  # Fallback cadence, used only when counts_hourly is false.
  counts_interval_seconds: 3600
  # ---- Everything else: as close to real time as is useful ----------------
  # Websites hit no database, so they are checked every 30s. The sites page
  # polls its own SQLite rows every 10s, which costs MySQL nothing.
  health_interval_seconds: 30
  # Where the Cron tab's data comes from.
  #   agent - each server pushes its own `crontab -l` to /api/cron/report via
  #           agent.py. The dashboard opens no SSH sessions at all, stores no
  #           SSH passwords, and cannot hang on a password prompt.
  #   ssh   - the old way: the dashboard logs into every host and reads them.
  cron_source: agent
  # Only used when cron_source is ssh. In agent mode the cadence is set on the
  # server instead, by CRON_INTERVAL_SECONDS in the agent's environment.
  cron_interval_seconds: 21600
  # A PM2 server is shown as OFFLINE if it hasn't reported in this long.
  pm2_stale_seconds: 30
  # SQLite file for dashboard history. Nothing is ever written to MySQL.
  db_path: "ops.db"
  # History older than this is deleted once a day. Health checks every 30s add
  # up (~14k rows/day), and the 24h uptime figure reads that table on every poll.
  history_keep_days: 90
  # How many single-partner queries may run against MySQL at the same time.
  # Only used by the per-partner "Refresh" button; the scheduled run is one query.
  max_concurrent_queries: 4


####################################################################
# MySQL connection.
#
# READ-ONLY. mysql.py rejects any statement that is not a bare SELECT,
# so this dashboard cannot INSERT / UPDATE / DELETE / DROP / ALTER.
#
# No password here - put it in `.env` (see .env.example). Every field
# can be overridden from the environment:
#   OPS_DB_HOST  OPS_DB_PORT  OPS_DB_USER  OPS_DB_PASSWORD  OPS_DB_NAME
####################################################################
database:
  # These defaults point at THIS laptop's MySQL, which holds a copy that
  # DISAGREES with production (active: 3,941/898 here vs 3,155/1,764 real).
  # Do not trust them.
  #
  # ./run-with-tunnel.sh overrides host/port to reach the real server over
  # SSH, which is the supported way to run this. The dashboard names its
  # source in the top bar so you always know which one answered.
  host: "127.0.0.1"
  port: 3306
  user: "webuser"
  database: "admin"
  connect_timeout: 10
  # The grouped scan takes ~8s on the AI server, ~37s on the laptop copy.
  read_timeout: 180


####################################################################
# The two counts, exactly as you specified them.
#
#   feed_total -> every event we hold for that partner. This is the
#                 number that matches "Partner Total Count" in the CSV.
#   db_future  -> published events that have not ended yet, i.e. today
#                 forward. Past events are excluded as you asked.
#
# %s is bound as a query parameter to the partner name - it is never
# formatted into the SQL string.
####################################################################
queries:
  # THE scheduled query. One grouped scan returns every partner at once
  # (~75s over 2.9M rows). Running the three per-partner counts separately
  # instead took ~8 minutes of repeated scans for the same answer.
  all_partners: "SELECT partner, COUNT(id) AS total, SUM(published = '1' AND enddates >= CURRENT_DATE) AS live, SUM(published = '1' AND enddates < CURRENT_DATE) AS ended, MAX(created) AS last_created FROM jos_eventlist_events WHERE partner IS NOT NULL AND partner <> '' GROUP BY partner"

  # The single-partner forms below are used only by the per-partner
  # "Refresh this partner" button.

  # Everything we hold for the partner (matches "Partner Total Count" in the CSV).
  feed_total: "SELECT COUNT(id) FROM jos_eventlist_events WHERE partner = %s"
  # Published and not yet ended - today forward. The events that still matter.
  db_future: "SELECT COUNT(id) FROM jos_eventlist_events WHERE published = '1' AND enddates >= CURRENT_DATE AND partner = %s"
  # Published but already over. Dead weight, but they did insert correctly.
  db_past: "SELECT COUNT(id) FROM jos_eventlist_events WHERE published = '1' AND enddates < CURRENT_DATE AND partner = %s"
  # Unpublished is derived as feed_total - db_future - db_past, so it costs no
  # extra query. It's the interesting one: rows that inserted but never went live.


####################################################################
# Websites / servers health-checked on a schedule.
#
# expect_status : the code(s) that count as healthy. May be a single
#                 number or a list. A list is the honest way to
#                 describe a host that always answers 401/403 - the
#                 server is up, and a change AWAY from that code is
#                 what you actually want to be told about.
# keyword       : optional string that must appear in the body
#
# The values below were set from a real run on 2026-07-28 - see the
# comment on each line for what was actually observed.
####################################################################
websites:
  - name: "eventseeker.com"
    url: "https://www.eventseeker.com"
    # Answered 403 from this machine even with a browser User-Agent, so a
    # WAF/CDN is blocking this host. Run the dashboard from an allowed
    # server and tighten this back to plain 200.
    expect_status: [200, 403]
    timeout: 15
  - name: "wcities.com"
    url: "https://www.wcities.com"
    expect_status: 200          # observed 200
    timeout: 15
  - name: "content.wcities.com"
    url: "http://content.wcities.com"
    expect_status: [200, 401]   # observed 401 - HTTP auth in front of it
    timeout: 15
  # Partner servers, per the CSV dated 2026-07-29. 198.61.136.172 and .174
  # no longer appear in the sheet at all - their partners moved onto the two
  # boxes below (44.198.210.209 went 22 -> 68 partners, 3.94.49.56 19 -> 51),
  # so they are not monitored here any more.
  - name: "Partner server 44.198.210.209 (68 partners)"
    url: "http://44.198.210.209"
    expect_status: 200          # observed 200
    timeout: 10
  - name: "Partner server 3.94.49.56 (51 partners)"
    url: "http://3.94.49.56"
    expect_status: 200          # observed 200
    timeout: 10

  # Still listed for 8 partners, but port 22 times out from this machine and
  # port 80 was never verified. Uncomment once you know what it should answer.
  # - name: "Partner server 198.61.136.173 (8 partners)"
  #   url: "http://198.61.136.173"
  #   timeout: 10




####################################################################
# Partner discovery.
#
# The partner list is NOT hardcoded - it comes from the database:
#   SELECT partner, ... FROM jos_eventlist_events GROUP BY partner
#
# That means a new partner shows up on the dashboard by itself, and
# nothing gets silently dropped. (The CSV's `type` column was doing
# exactly that: `active` has a blank type, so a type="feed" rule hid
# a live weekly partner with ~900 live events.)
#
# min_live_events: a partner needs at least this many published,
#   not-yet-ended events to appear. 1 keeps every partner that still
#   has something live and hides the long-dead ones (~117 of 149).
#   Set to 0 to show every partner in the table, live or not.
####################################################################
partner_discovery:
  min_live_events: 1
  exclude:
    - "bw"
    - "brownpaper"
    - "digitick"
    - "draisgroup"
    - "etix"
    - "college-sports"


