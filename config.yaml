####################################################################
# Ops Dashboard configuration
#
# The partner list is NOT here - it is discovered from the database on
# every run (see `partner_discovery` below). The `partner_meta` block
# at the bottom only supplies cosmetic extras (server, frequency,
# path, note) read from "Monday Partner Status - Final.csv".
#
# partner_meta was last regenerated from the CSV dated 2026-07-29.
####################################################################

app:
  # Shared secret that agent.py sends in the x-agent-secret header.
  agent_secret: "change-this-to-a-secure-token"
  # ---- MySQL: strictly hourly ---------------------------------------------
  # counts_hourly fires the grouped COUNT() sweep on the top of every hour and
  # at no other time: 24 hits in 24 hours, exactly. A plain interval timer
  # cannot promise that - each cycle starts its wait only after the previous
  # run finishes, so a ~75s sweep pushes every later run further into the hour,
  # and every restart of the process begins a brand new cycle.
  #
  # Restarts don't buy an extra sweep either: on startup the dashboard collects
  # only if the stored counts are already older than an hour.
  counts_hourly: true
  # Fallback cadence, used only when counts_hourly is false.
  counts_interval_seconds: 3600
  # ---- Everything else: as close to real time as is useful ----------------
  # Websites hit no database, so they are checked every 30s. The sites page
  # polls its own SQLite rows every 10s, which costs MySQL nothing.
  health_interval_seconds: 30
  # Turned off on 2026-07-31: this dashboard must not hit or crawl the monitored
  # sites at all. Nothing here requests those URLs while this is false - the
  # scheduled loop is never started and "Check all now" refuses. The sites tab
  # keeps showing the last stored result, and the live signal is the Processes
  # tab, which comes from pm2 on each server and needs no request to the site.
  # Set back to true to resume polling; health_interval_seconds still applies.
  health_checks_enabled: false
  # Where the Cron tab's data comes from.
  #   agent - each server pushes its own `crontab -l` to /api/cron/report via
  #           agent.py. The dashboard opens no SSH sessions at all, stores no
  #           SSH passwords, and cannot hang on a password prompt.
  #   ssh   - the old way: the dashboard logs into every host and reads them.
  cron_source: agent
  # Only used when cron_source is ssh. In agent mode the cadence is set on the
  # server instead, by CRON_INTERVAL_SECONDS in the agent's environment.
  cron_interval_seconds: 21600
  # A PM2 server is shown as OFFLINE if it hasn't reported in this long.
  pm2_stale_seconds: 30
  # SQLite file for dashboard history. Nothing is ever written to MySQL.
  db_path: "ops.db"
  # History older than this is deleted once a day. Health checks every 30s add
  # up (~14k rows/day), and the 24h uptime figure reads that table on every poll.
  history_keep_days: 90
  # How many single-partner queries may run against MySQL at the same time.
  # Only used by the per-partner "Refresh" button; the scheduled run is one query.
  max_concurrent_queries: 4

  # ---- Spreadsheet comparison ---------------------------------------------
  # Where uploaded partner sheets are kept. The originals are stored so the
  # source of a comparison can be downloaded back - a disputed "412 missing"
  # cannot be settled without the file it came from.
  upload_dir: "uploads"
  # Largest sheet accepted, in megabytes. Rejected at the door rather than read
  # into memory first.
  max_upload_mb: 25
  # Most database records that may be pulled for one comparison. A partner with
  # more than this produces NO comparison rather than a partial one: unread rows
  # would be reported as missing, which is a wrong answer that looks like a real
  # finding. Raise it if you need to compare a very large partner, remembering
  # this is a row-by-row read of MySQL, not a COUNT.
  max_compare_rows: 100000

  # ---- Event CSV exports ---------------------------------------------------
  # Where generated per-partner event CSVs are written. These are the real
  # event rows, not the count history - see `queries.partner_events`.
  export_dir: "exports"
  # Generated files older than this are deleted once a day. They are always
  # reproducible from the database, so keeping them forever only costs disk.
  export_keep_days: 7
  # A hard ceiling per export, or 0 for no limit. This is a truncation point,
  # not a refusal: unlike the spreadsheet comparison, a partial event export is
  # still a usable file, and the row count in the UI says how many it holds.
  max_export_rows: 0

  # ---- Fetched cron output -------------------------------------------------
  # Where whole cron output files pulled off the servers are kept. These can be
  # large (the biggest on record is 426 MB), so they are pruned on the same
  # schedule as generated exports.
  fetch_dir: "fetched"
  # Refuses a single transfer larger than this, in MB. A guard against filling
  # the disk with one click, not a normal limit - 426 MB moves in about 8s
  # because the file is gzipped in transit.
  max_fetch_mb: 2000

  # ---- Logs ----------------------------------------------------------------
  # Written by the app itself so the Logs page has something to read even when
  # the process was not started under systemd. Relative paths sit beside the code.
  log_file: "dashboard.log"
  log_level: "INFO"


####################################################################
# MySQL connection.
#
# READ-ONLY. mysql.py rejects any statement that is not a bare SELECT,
# so this dashboard cannot INSERT / UPDATE / DELETE / DROP / ALTER.
#
# No password here - put it in `.env` (see .env.example). Every field
# can be overridden from the environment:
#   OPS_DB_HOST  OPS_DB_PORT  OPS_DB_USER  OPS_DB_PASSWORD  OPS_DB_NAME
####################################################################
database:
  # These defaults point at THIS laptop's MySQL, which holds a copy that
  # DISAGREES with production (active: 3,941/898 here vs 3,155/1,764 real).
  # Do not trust them.
  #
  # ./run-with-tunnel.sh overrides host/port to reach the real server over
  # SSH, which is the supported way to run this. The dashboard names its
  # source in the top bar so you always know which one answered.
  host: "127.0.0.1"
  port: 3306
  user: "webuser"
  database: "admin"
  connect_timeout: 10
  # The grouped scan takes ~8s on the AI server, ~37s on the laptop copy.
  read_timeout: 180


####################################################################
# The two counts, exactly as you specified them.
#
#   feed_total -> every event we hold for that partner. This is the
#                 number that matches "Partner Total Count" in the CSV.
#   db_future  -> published events that have not ended yet, i.e. today
#                 forward. Past events are excluded as you asked.
#
# %s is bound as a query parameter to the partner name - it is never
# formatted into the SQL string.
####################################################################
queries:
  # THE scheduled query. One grouped scan returns every partner at once
  # (~75s over 2.9M rows). Running the three per-partner counts separately
  # instead took ~8 minutes of repeated scans for the same answer.
  all_partners: "SELECT partner, COUNT(id) AS total, SUM(published = '1' AND enddates >= CURRENT_DATE) AS live, SUM(published = '1' AND enddates < CURRENT_DATE) AS ended, MAX(created) AS last_created FROM jos_eventlist_events WHERE partner IS NOT NULL AND partner <> '' GROUP BY partner"

  # The single-partner forms below are used only by the per-partner
  # "Refresh this partner" button.

  # Everything we hold for the partner (matches "Partner Total Count" in the CSV).
  feed_total: "SELECT COUNT(id) FROM jos_eventlist_events WHERE partner = %s"
  # Published and not yet ended - today forward. The events that still matter.
  db_future: "SELECT COUNT(id) FROM jos_eventlist_events WHERE published = '1' AND enddates >= CURRENT_DATE AND partner = %s"
  # Published but already over. Dead weight, but they did insert correctly.
  db_past: "SELECT COUNT(id) FROM jos_eventlist_events WHERE published = '1' AND enddates < CURRENT_DATE AND partner = %s"
  # Unpublished is derived as feed_total - db_future - db_past, so it costs no
  # extra query. It's the interesting one: rows that inserted but never went live.

  # ---- Spreadsheet comparison ---------------------------------------------
  # The ONLY query that returns individual records rather than a count, and the
  # only way matching / missing / extra can be answered honestly: two sides can
  # hold the same number of rows and still not hold the same rows.
  #
  # Column ORDER is part of the contract - compare.fetch_db_rows unpacks it as
  # id, title, start, end, url, published. Change the columns if your schema
  # differs, but keep the six positions.
  #
  # partner_url is included because it is what a partner sheet can actually be
  # tied to: it carries the product URL (and usually the product id in its last
  # path segment), while our `id` means nothing on their side.
  #
  # The second %s is the row cap, bound as a parameter. It is deliberately asked
  # for as cap+1 so overflow is detected rather than silently truncating into a
  # comparison that would report every unread row as missing.
  partner_records: "SELECT id, title, dates, enddates, partner_url, published FROM jos_eventlist_events WHERE partner = %s ORDER BY id LIMIT %s"

  # ---- The per-partner event CSV ------------------------------------------
  # The actual event data behind the "Generate CSV" button, one row per record
  # we hold for that partner. Read in batches and written straight to disk, so
  # a partner with 862,000 events costs the same memory as one with 200.
  #
  # Three parameters are bound, in this order: partner, the last id already
  # written, and the batch size. That middle one is KEYSET paging - a
  # replacement query must keep `AND id > %s ... ORDER BY id LIMIT %s` rather
  # than using OFFSET, which re-walks every earlier row on every batch and
  # turns a large partner into a several-minute scan.
  #
  # `id` must be selected: it is what each batch resumes from. Every other
  # column is free - the export writes whichever of them `exports.event_columns`
  # names, matched by the name in this SELECT list rather than by position.
  partner_events: "SELECT id, partner_event_id, title, dates, times, enddates, endtimes, locid, price, free_event, booking_url, partner_url, website, published, cancelled, created, modified FROM jos_eventlist_events WHERE partner = %s AND id > %s ORDER BY id LIMIT %s"

  # Venue name/city/state/country for the `locid`s in a batch.
  #
  # `venue_details` holds one row per partner submission - wid 92158 has 56,
  # spelling the country four different ways - so this returns candidates and
  # the lowest id per wid is chosen in code. Selecting MIN() per column instead
  # would emit a venue that never existed: one submission's name beside another
  # submission's city.
  #
  # {placeholders} is filled with one %s per id in the batch.
  venue_details: "SELECT wid, id, name, city, state, country FROM venue_details WHERE wid IN ({placeholders})"


####################################################################
# Which columns the generated event CSV carries, and their headers.
#
# Each key must be a column named in `queries.partner_events`, or one
# of the four filled in from the venue lookup: venue, venue_city,
# venue_state, venue_country.
#
# This is a list rather than code so the file can be lined up with
# whichever spreadsheet the team reconciles against - reorder, rename
# a header, or drop a column without touching Python. The default
# below covers the event fields this database actually holds.
####################################################################
exports:
  event_columns:
    - [id, "Event ID"]
    - [partner_event_id, "Partner Event ID"]
    - [title, "Title"]
    - [dates, "Start Date"]
    - [times, "Start Time"]
    - [enddates, "End Date"]
    - [endtimes, "End Time"]
    - [venue, "Venue"]
    - [venue_city, "City"]
    - [venue_state, "State"]
    - [venue_country, "Country"]
    - [price, "Price"]
    - [free_event, "Free Event"]
    - [booking_url, "Booking URL"]
    - [partner_url, "Partner URL"]
    - [website, "Website"]
    - [published, "Published"]
    - [cancelled, "Cancelled"]
    - [created, "Created"]
    - [modified, "Modified"]


####################################################################
# Websites / servers health-checked on a schedule.
#
# expect_status : the code(s) that count as healthy. May be a single
#                 number or a list. A list is the honest way to
#                 describe a host that always answers 401/403 - the
#                 server is up, and a change AWAY from that code is
#                 what you actually want to be told about.
# keyword       : optional string that must appear in the body
#
# The values below were set from a real run on 2026-07-28 - see the
# comment on each line for what was actually observed.
####################################################################
websites:
  - name: "eventseeker.com"
    url: "https://www.eventseeker.com"
    # Answered 403 from this machine even with a browser User-Agent, so a
    # WAF/CDN is blocking this host. The apex (https://eventseeker.com)
    # behaves identically and resolves to the same site, so it is not listed
    # twice. Run the dashboard from an allowed server and tighten this back
    # to plain 200.
    expect_status: [200, 403]
    timeout: 15
  - name: "cityseeker.com"
    url: "https://cityseeker.com"
    # Same WAF as eventseeker - 403 from this machine on 2026-07-31, with and
    # without the www.
    expect_status: [200, 403]
    timeout: 15
  - name: "mvc.wcities.com"
    url: "https://mvc.wcities.com"
    expect_status: 200          # observed 200 (redirects to /login)
    timeout: 15
  - name: "concierge.wcities.com"
    url: "https://concierge.wcities.com"
    expect_status: 200          # observed 200 (redirects to /login)
    timeout: 15
  - name: "experience.wcities.com"
    url: "https://experience.wcities.com"
    expect_status: 200          # observed 200
    timeout: 15
  - name: "nearmyhotel.wcities.com"
    url: "http://nearmyhotel.wcities.com"
    # Redirects http -> https and then to a per-hotel path; 200 at the end.
    # Took ~4s on 2026-07-31, hence the longer timeout.
    expect_status: 200
    timeout: 20
  - name: "rtrlocal.com"
    url: "https://rtrlocal.com"
    # Also redirects to a generated path (observed /WASJW) and answers 200.
    expect_status: 200
    timeout: 20
  - name: "wcities.com"
    url: "https://www.wcities.com"
    expect_status: 200          # observed 200
    timeout: 15
  - name: "content.wcities.com"
    url: "http://content.wcities.com"
    expect_status: [200, 401]   # observed 401 - HTTP auth in front of it
    timeout: 15
  # Partner servers, per the CSV dated 2026-07-29. 198.61.136.172 and .174
  # no longer appear in the sheet at all - their partners moved onto the two
  # boxes below (44.198.210.209 went 22 -> 68 partners, 3.94.49.56 19 -> 51),
  # so they are not monitored here any more.
  - name: "Partner server 44.198.210.209 (68 partners)"
    url: "http://44.198.210.209"
    expect_status: 200          # observed 200
    timeout: 10
  - name: "Partner server 3.94.49.56 (51 partners)"
    url: "http://3.94.49.56"
    expect_status: 200          # observed 200
    timeout: 10

  # Still listed for 8 partners, but port 22 times out from this machine and
  # port 80 was never verified. Uncomment once you know what it should answer.
  # - name: "Partner server 198.61.136.173 (8 partners)"
  #   url: "http://198.61.136.173"
  #   timeout: 10




####################################################################
# Email alerts for the sites above.
#
# What gets sent, and nothing else:
#   DOWN       once, after `failures_before_alert` checks fail in a row
#              (checks are 30s apart, so 2 = about a minute of downtime).
#              One bad check is not an outage and must not wake anyone.
#   STILL DOWN a reminder every `repeat_hours` while it stays down.
#              Set repeat_hours: 0 to switch reminders off.
#   RECOVERED  once, when it answers `successes_before_recovery` times again.
#
# The up/down state is stored in SQLite, so restarting the dashboard does not
# re-send an alert for an outage that was already reported.
#
# The SMTP PASSWORD is not here - it is read from .env / the environment as
# OPS_SMTP_PASSWORD, like the database password. host/user/recipients can also
# be overridden by OPS_SMTP_HOST, OPS_SMTP_USER and OPS_ALERT_TO.
#
# Until smtp.host and from_address are filled in, alerts are recorded in the
# alert_log table and shown on the Sites page as "not sent" - nothing is
# silently dropped, and the health checks keep running either way.
####################################################################
alerts:
  enabled: true
  recipients:
    - "farooque@wcities.com"
    - "ozair@wcities.com"
    - "mayur@wcities.com"
    - "rahul@wcities.com"
  from_address: ""            # e.g. "monitor@wcities.com" (or set OPS_ALERT_FROM)
  from_name: "Ops Dashboard"
  failures_before_alert: 2    # ~60s down before the first mail
  successes_before_recovery: 2
  repeat_hours: 6             # reminder cadence while still down; 0 = off
  send_recovery: true
  dashboard_url: "https://monitor.wcities.com/sites"
  smtp:
    host: ""                  # e.g. "smtp.gmail.com" or the wcities mail server
    port: 587
    security: starttls        # starttls (587) | ssl (465) | none (local relay)
    username: ""              # usually the same as from_address
    # password -> OPS_SMTP_PASSWORD in .env, never in this file
    timeout: 20


####################################################################
# Partner discovery.
#
# The partner list is NOT hardcoded - it comes from the database:
#   SELECT partner, ... FROM jos_eventlist_events GROUP BY partner
#
# That means a new partner shows up on the dashboard by itself, and
# nothing gets silently dropped. (The CSV's `type` column was doing
# exactly that: `active` has a blank type, so a type="feed" rule hid
# a live weekly partner with ~900 live events.)
#
# min_live_events: a partner needs at least this many published,
#   not-yet-ended events to appear. 1 keeps every partner that still
#   has something live and hides the long-dead ones (~117 of 149).
#   Set to 0 to show every partner in the table, live or not.
####################################################################
partner_discovery:
  min_live_events: 1
  exclude:
    - "bw"
    - "brownpaper"
    - "digitick"
    - "draisgroup"
    - "etix"
    - "college-sports"


